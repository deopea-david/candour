name: Coordinator output style

# .claude/output-styles/coordinator.md is generated from roles/coordinator.md.
# This fails the pull request if the two have drifted. Fix: run
#   python3 scripts/build-coordinator-style.py
# and commit the result. Never edit the generated file by hand.

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # actions/checkout v7.0.1, pinned to its commit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Output style is current with the charter
        run: python3 scripts/build-coordinator-style.py --check
