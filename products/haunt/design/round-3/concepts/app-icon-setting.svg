<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1030" viewBox="0 0 960 1030" role="img" aria-labelledby="t d">
<title id="t">Haunts app icon setting (option 2)</title>
<desc id="d">A separate, user-chosen app icon setting with three icons, independent of theme.</desc>
<rect width="960" height="1030" fill="#E9E9E6"/><text x="40.0" y="44.0" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" fill="#111" text-anchor="start">Option 2 only: a separate App icon setting</text><text x="40.0" y="70.0" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#444" text-anchor="start">Shown for the CEO's decision (finalise.md §4), not adopted. Default = the store icon. Every icon needs dark, clear and tinted variants (Apple HIG).</text><g transform="translate(60,110)"><clipPath id="ap49"><rect width="390" height="844" rx="52"/></clipPath><g clip-path="url(#ap49)"><rect width="390" height="844" fill="#FFF8F1"/><text x="32.0" y="34.0" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#241B2F" text-anchor="start">9:41</text><rect x="300" y="24" width="17" height="10" rx="2" fill="#241B2F"/><rect x="324" y="22" width="26" height="13" rx="3.5" fill="none" stroke="#241B2F" stroke-width="1.2"/><rect x="326.5" y="24.5" width="19" height="8" rx="1.5" fill="#241B2F"/><path d="M24,70 l-8,8 l8,8" fill="none" stroke="#5B2A86" stroke-width="2.2" stroke-linecap="round"/><text x="36.0" y="84.0" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="500" fill="#5B2A86" text-anchor="start">Appearance</text><text x="16.0" y="132.0" font-family="Newsreader, 'New York', Georgia, 'Times New Roman', serif" font-size="34" font-weight="600" fill="#241B2F" text-anchor="start">App icon</text><rect x="16" y="166" width="358" height="96" rx="20" fill="#FFFFFF" stroke="#5B2A86" stroke-width="3"/><g transform="translate(32,184) scale(0.05859)"><defs><clipPath id="ai46"><rect width="1024" height="1024" rx="229"/></clipPath></defs><g clip-path="url(#ai46)"><rect width="1024" height="1024" fill="#5B2A86"/><g transform="translate(0,-34) translate(512,480) scale(1.0) translate(-512,-480)"><rect x="336" y="200" width="112" height="552" fill="#FFF8F1"/><rect x="276" y="200" width="172" height="42" rx="4" fill="#FFF8F1"/><rect x="266" y="712" width="250" height="42" rx="4" fill="#FFF8F1"/><path d="M448,478 C506,388 718,370 734,512 V754 H622 V530 C622,452 526,448 448,540 Z" fill="#FFF8F1"/><rect x="566" y="712" width="232" height="42" rx="4" fill="#FFF8F1"/></g><rect x="266" y="760" width="532" height="36" rx="4" fill="#F2A65A"/><rect x="266" y="812" width="532" height="16" rx="3" fill="#F2A65A"/></g></g><text x="110.0" y="208.0" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#241B2F" text-anchor="start">Plum</text><text x="110.0" y="230.0" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#5C5266" text-anchor="start">The h on plum, with a double rule.</text><circle cx="346" cy="214" r="13" fill="#5B2A86" stroke="#FFFFFF" stroke-width="2.5"/><path d="M340,214 l4,4 l8,-8" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="16" y="274" width="358" height="96" rx="20" fill="#FFFFFF" stroke="#8C7F99" stroke-width="1"/><g transform="translate(32,292) scale(0.05859)"><defs><clipPath id="ai47"><rect width="1024" height="1024" rx="229"/></clipPath></defs><g clip-path="url(#ai47)"><rect width="1024" height="1024" fill="#FFF8F1"/><g transform="translate(-60,10) translate(512,480) scale(0.95) translate(-512,-480)"><rect x="336" y="200" width="112" height="552" fill="#5B2A86"/><rect x="276" y="200" width="172" height="42" rx="4" fill="#5B2A86"/><rect x="266" y="712" width="250" height="42" rx="4" fill="#5B2A86"/><path d="M448,478 C506,388 718,370 734,512 V754 H622 V530 C622,452 526,448 448,540 Z" fill="#5B2A86"/><rect x="566" y="712" width="232" height="42" rx="4" fill="#5B2A86"/></g><circle cx="790" cy="712" r="58" fill="#F2A65A"/></g></g><text x="110.0" y="316.0" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600" fill="#241B2F" text-anchor="start">Cream</text><text x="110.0" y="338.0" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#5C5266" text-anchor="start">The h with a full stop.</text><rect x="16" y="382" width="358" height="96" rx="20" fill="#FFFFFF" stroke="#8C7F99" stroke-width="1"/><g transform="translate(32,400) scale(0.05859)"><defs><clipPath id="ai48"><rect width="1024" height="1024" rx="229"/></clipPath></defs><g clip-path="url(#ai48)"><rect width="1024" height="1024" fill="#111111"/><g transform="translate(-50,-10) translate(512,480) scale(0.92) translate(-512,-480)"><rect x="336" y="200" width="112" height="552" fill="#FFFFFF"/><rect x="276" y="200" width="172" height="42" rx="4" fill="#FFFFFF"/><rect x="266" y="712" width="250" height="42" rx="4" fill="#FFFFFF"/><path d="M448,478 C506,388 718,370 734,512 V754 H622 V530 C622,452 526,448 448,540 Z" fill="#FFFFFF"/><rect x="566" y="712" width="232" height="42" rx="4" fill="#FFFFFF"/></g><rect x="712" y="700" width="120" height="44" fill="#C2410C"/></g></g><text x="110.0" y="424.0" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600" fill="#241B2F" text-anchor="start">Black</text><text x="110.0" y="446.0" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#5C5266" text-anchor="start">The h on black, with an orange bar.</text><text x="16.0" y="506.0" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#5C5266" text-anchor="start">The icon on your home screen. Changing it does</text><text x="16.0" y="526.0" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#5C5266" text-anchor="start">not change the theme, and the theme never</text><text x="16.0" y="546.0" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#5C5266" text-anchor="start">changes it.</text></g><rect x="-1" y="-1" width="392" height="846" rx="53" fill="none" stroke="#0B0B0C" stroke-width="10"/><rect x="140" y="11" width="110" height="30" rx="15" fill="#0B0B0C"/></g><text x="500.0" y="160.0" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#333" text-anchor="start">Independent of the theme, in both directions.</text><text x="500.0" y="186.0" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#333" text-anchor="start">Draft copy. Icon names describe what people see.</text><text x="500.0" y="212.0" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#333" text-anchor="start">Radio group for screen readers, as in the theme picker.</text><text x="500.0" y="238.0" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#333" text-anchor="start">No icon is locked, earned or promoted (THEME-6 applies).</text><text x="500.0" y="264.0" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#333" text-anchor="start">iOS may show a system notice when the icon changes [K];</text><text x="500.0" y="290.0" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#333" text-anchor="start">that is expected, and the CTO confirms the behaviour.</text><text x="500.0" y="316.0" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#333" text-anchor="start">Never a disguise: Apple says to avoid an icon</text><text x="500.0" y="342.0" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#333" text-anchor="start">'someone might mistake for another app' [E].</text>
</svg>
