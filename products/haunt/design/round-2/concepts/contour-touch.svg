<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="t d">
<title id="t">Haunts Contour touch</title>
<desc id="d">Contour-line texture confined to an empty header band, light and dark.</desc>
<rect width="960" height="560" fill="#E9E9E6"/><text x="40.0" y="44.0" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" fill="#111" text-anchor="start">Keeping a Contour touch: texture in empty space only</text><text x="40.0" y="70.0" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#444" text-anchor="start">Top of the self-portrait screen (LOOK-8), Hybrid A. Open lines, never closed rings; no pins, no routes;</text><text x="40.0" y="90.0" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#444" text-anchor="start">never behind text. The screen's copy is placeholder.</text><g transform="translate(60,100)"><clipPath id="ct151f"><rect width="390" height="400" rx="30"/></clipPath><g clip-path="url(#ct151f)"><rect width="390" height="400" fill="#FFF8F1"/><text x="32.0" y="34.0" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#241B2F" text-anchor="start">9:41</text><rect x="300" y="24" width="17" height="10" rx="2" fill="#241B2F"/><rect x="324" y="22" width="26" height="13" rx="3.5" fill="none" stroke="#241B2F" stroke-width="1.2"/><rect x="326.5" y="24.5" width="19" height="8" rx="1.5" fill="#241B2F"/><clipPath id="ct151"><rect x="0" y="48" width="390" height="150"/></clipPath><g clip-path="url(#ct151)"><path d="M-20,60 C80,40 180,92 260,62 S360,40 420,70" fill="none" stroke="#F2A65A" stroke-width="1.3" stroke-opacity="0.55"/><path d="M-20,76 C80,50 180,108 260,78 S360,56 420,86" fill="none" stroke="#F2A65A" stroke-width="1.3" stroke-opacity="0.55"/><path d="M-20,92 C80,60 180,124 260,94 S360,72 420,102" fill="none" stroke="#F2A65A" stroke-width="1.3" stroke-opacity="0.55"/><path d="M-20,108 C80,88 180,140 260,110 S360,88 420,118" fill="none" stroke="#F2A65A" stroke-width="1.3" stroke-opacity="0.55"/><path d="M-20,124 C80,98 180,156 2